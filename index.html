<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <form method="post" style="display: flex; flex-direction: column; gap: 10px; max-width: 300px">
      <label>Cheese<input type="checkbox" name="ingredient[]" value="cheese" /></label>
      <label>Banana<input type="checkbox" name="ingredient[]" value="banana" /></label>
      <label>Eggs<input type="checkbox" name="ingredient[]" value="eggs" /></label>
      <label>Oats<input type="checkbox" name="ingredient[]" value="oats" /></label>
      <label>Onion<input type="checkbox" name="ingredient[]" value="onion" /></label>
      <label>Tomato<input type="checkbox" name="ingredient[]" value="tomato" /></label>
      <label>Cucumber<input type="checkbox" name="ingredient[]" value="cucumber" /></label>
      <label>Chicken<input type="checkbox" name="ingredient[]" value="chicken" /></label>
      <label>Beef<input type="checkbox" name="ingredient[]" value="beef" /></label>
      <label>Pork<input type="checkbox" name="ingredient[]" value="pork" /></label>
      <button type="submit">Submit</button>
    </form>
  </body>
  <script>
    const form = document.querySelector("form");

    async function whenTheFormWillSubmit(event) {
      event.preventDefault();
      const list = document.querySelectorAll('input[type="checkbox"]:checked');
      const ingredients = Array.from(list).map((checkbox) => checkbox.value);
      const body = JSON.stringify(ingredients);
      const response = await fetch("api/recipes.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body,
      });
      const reply = await response.json();
      if (!response.ok) {
        console.error(reply.error);
        return;
      }
      console.log(reply.recipes);
    }

    form.addEventListener("submit", whenTheFormWillSubmit);
  </script>
</html>
